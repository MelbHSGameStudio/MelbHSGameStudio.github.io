<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Games</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header class="hero">
        <h1>My Games</h1>
        <p>Projects, experiments, and playable builds.</p>
    </header>

    <main class="games-container">

        <div class="game-card">
            <img src="images/game1.png" alt="Game 1">
            <div class="game-info">
                <h2>Dungeon Escape</h2>
                <p>
                    A pixel-art roguelike where you fight through procedurally
                    generated dungeons.
                </p>

                <div class="buttons">
                    <a href="https://yourgamelink.com" target="_blank">
                        Play
                    </a>

                    <a href="https://github.com/yourusername/dungeon-escape"
                       target="_blank">
                        Source
                    </a>
                </div>
            </div>
        </div>

        <div class="game-card">
            <img src="images/game2.png" alt="Game 2">
            <div class="game-info">
                <h2>Sky Runner</h2>
                <p>
                    Fast-paced endless runner with movement mechanics inspired
                    by classic arcade games.
                </p>

                <div class="buttons">
                    <a href="https://yourgamelink.com" target="_blank">
                        Play
                    </a>

                    <a href="https://github.com/yourusername/skyrunner"
                       target="_blank">
                        Source
                    </a>
                </div>
            </div>
        </div>

    </main>

    <footer>
        <p>Made by YourName</p>
    </footer>

</body>
</html>
